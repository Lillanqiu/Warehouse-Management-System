services:
  warehouse:
    build: .
    container_name: warehouse-system
    ports:
      - "${WAREHOUSE_HOST_PORT:-38280}:8000"
    environment:
      PORT: 8000
      PUBLIC_PORT: "${WAREHOUSE_HOST_PORT:-38280}"
      WAREHOUSE_ADMIN_PASSWORD: "${WAREHOUSE_ADMIN_PASSWORD:-admin}"
      WAREHOUSE_IMPORTED_USER_PASSWORD: "${WAREHOUSE_IMPORTED_USER_PASSWORD:-change-me-before-use}"
      CONFIG_FILE: /data/port.env
      DATA_DIR: /data
    volumes:
      - warehouse_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); raise SystemExit(0 if data.get('ok') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  warehouse_data:
